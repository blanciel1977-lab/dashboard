<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진소령 · Portfolio Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8FA;
    --bg-wash: #EEF6F5;
    --surface: #FFFFFF;
    --text: #0F172A;
    --muted: #475569;
    --muted-soft: #64748B;
    --accent: #0F766E;
    --accent-soft: #CCFBF1;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;
    --danger: #B91C1C;
    --danger-soft: #FEE2E2;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    background:
      radial-gradient(720px 380px at 0% 0%, rgba(15, 118, 110, 0.07), transparent 60%),
      linear-gradient(180deg, var(--bg-wash) 0%, var(--bg) 38%, var(--bg) 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app {
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 28px 64px;
  }

  /* ===== Brand / Hero ===== */
  .brand-bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    animation: fadeUp 0.55s ease both;
  }
  .brand-name {
    margin: 0;
    font-size: clamp(36px, 5.5vw, 48px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.2;
    color: var(--text);
  }
  .brand-role {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .hero {
    margin-bottom: 28px;
    animation: fadeUp 0.55s ease 0.06s both;
  }
  .hero-lead {
    margin: 0;
    max-width: 36em;
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
    font-weight: 400;
  }

  /* ===== Inline stats ===== */
  .stat-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 0;
    padding: 16px 0;
    margin-bottom: 8px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    animation: fadeUp 0.55s ease 0.1s both;
  }
  .stat {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 18px;
  }
  .stat:first-child { padding-left: 0; }
  .stat + .stat {
    border-left: 1px solid var(--line);
  }
  .stat-value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }

  /* ===== Text tabs ===== */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    margin: 24px 0 20px;
    animation: fadeUp 0.55s ease 0.14s both;
  }
  .tab {
    position: relative;
    border: none;
    background: transparent;
    padding: 8px 0 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted-soft);
    cursor: pointer;
    transition: color 0.18s ease;
  }
  .tab::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.22s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    font-weight: 700;
  }
  .tab.active::after { transform: scaleX(1); }

  /* ===== Layout ===== */
  .layout {
    display: grid;
    grid-template-columns: 1.2fr 0.95fr;
    gap: 20px;
    align-items: start;
    animation: fadeUp 0.55s ease 0.18s both;
  }

  .project-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .project {
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 22px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    position: relative;
  }
  .project::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .project:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow);
  }
  .project.active {
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }
  .project.active::before { opacity: 1; }

  .project-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
  }
  .project-tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .project-status {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .project-status.repo {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .project h2 {
    margin: 0 0 6px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.35;
    color: var(--text);
  }
  .project p {
    margin: 0;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* ===== Light detail panel ===== */
  .detail {
    position: sticky;
    top: 20px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 28px 26px;
    min-height: 380px;
  }
  .detail-inner {
    animation: crossfade 0.28s ease both;
  }
  .detail-kicker {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .detail h3 {
    margin: 0 0 14px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.3;
    color: var(--text);
  }
  .detail .desc {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
  }
  .detail-meta {
    display: grid;
    gap: 0;
    margin-bottom: 24px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .meta-row span:first-child {
    color: var(--muted-soft);
    font-weight: 500;
    flex-shrink: 0;
  }
  .meta-row span:last-child {
    font-weight: 600;
    color: var(--text);
    text-align: right;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #0D9488; }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn[aria-disabled="true"] {
    opacity: 0.45;
    pointer-events: none;
  }

  .highlights {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .highlights h4 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted-soft);
  }
  .highlights ul {
    margin: 0;
    padding-left: 18px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--muted);
  }
  .highlights li + li { margin-top: 4px; }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted-soft);
    animation: fadeUp 0.55s ease 0.22s both;
  }
  footer a {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }
  footer a:hover { color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes crossfade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .detail { position: static; }
    .brand-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
    .stat + .stat { border-left: none; }
    .stat {
      padding: 4px 16px 4px 0;
      border-right: 1px solid var(--line);
    }
    .stat:last-child { border-right: none; }
  }
  @media (max-width: 480px) {
    .app { padding: 24px 16px 48px; }
    .project { padding: 16px 18px; }
    .project h2 { font-size: 19px; }
    .detail { padding: 22px 18px; }
    .detail h3 { font-size: 22px; }
  }
</style>
</head>

    status: null,
    statusLabel: null,
    stack: "HTML · 스토리텔링",
    audience: "채용 · 협업 · 강의",
    summary: "진소령의 본문 포트폴리오입니다. Developer에서 Educator, AI Creator로 이어지는 여정과 Education Lab, 학교 교육 이력, AI 창작 갤러리를 소개합니다.",
    highlights: [
      "세 가지 정체성 스토리 (Developer / Educator / AI Creator)",
      "Coding · AI · Maker · Creator Lab",
      "2024–2026 학교 교육 포트폴리오",
      "AI 창작·출판 프로젝트 소개"
    ],
    demo: "https://blanciel1977-lab.github.io/portfolio/",
    repo: "https://github.com/blanciel1977-lab/portfolio"
  }
];

let activeId = PROJECTS[0].id;
let filter = "all";

const listEl = document.getElementById("projectList");
const detailEl = document.getElementById("detailPanel");

function renderList() {
  const visible = PROJECTS.filter(p => filter === "all" || p.category === filter);
  listEl.innerHTML = visible.map(p => `
    <button type="button" class="project ${p.id === activeId ? "active" : ""}" data-id="${p.id}" role="listitem">
      <div class="project-top">
        <span class="project-tag">${p.categoryLabel}</span>
        ${p.statusLabel
          ? `<span class="project-status ${p.status === "repo" ? "repo" : ""}">${p.statusLabel}</span>`
          : ""}
      </div>
      <h2>${p.title}</h2>
      <p>${p.short}</p>
    </button>
  `).join("");

  if (!visible.some(p => p.id === activeId) && visible[0]) {
    activeId = visible[0].id;
  }
  renderDetail();
}

function renderDetail() {
  const p = PROJECTS.find(x => x.id === activeId) || PROJECTS[0];
  detailEl.style.animation = "none";
  void detailEl.offsetWidth;
  detailEl.style.animation = "";
  detailEl.innerHTML = `
    <div class="detail-kicker">${p.categoryLabel}</div>
    <h3>${p.title}</h3>
    <p class="desc">${p.summary}</p>
    <div class="detail-meta">
      <div class="meta-row"><span>기술 스택</span><span>${p.stack}</span></div>
      <div class="meta-row"><span>대상</span><span>${p.audience}</span></div>
      ${p.statusLabel
        ? `<div class="meta-row"><span>상태</span><span>${p.statusLabel}</span></div>`
        : ""}
    </div>
    <div class="actions">
      ${p.demo
        ? `<a class="btn btn-primary" href="${p.demo}" target="_blank" rel="noopener">데모 열기 →</a>`
        : `<span class="btn btn-primary" aria-disabled="true">데모 준비 중</span>`}
    </div>
    <div class="highlights">
      <h4>Highlights</h4>
      <ul>${p.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
    </div>
  `;

  listEl.querySelectorAll(".project").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.id === activeId);
  });
}

listEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".project");
  if (!btn) return;
  activeId = btn.dataset.id;
  renderDetail();
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });
    tab.classList.add("active");
    tab.setAttribute("aria-selected", "true");
    filter = tab.dataset.filter;
    renderList();
  });
});

document.getElementById("kpiLive").textContent =
  PROJECTS.filter(p => p.demo).length;
document.getElementById("kpiTotal").textContent = PROJECTS.length;

renderList();
</script>
</body>
</html>

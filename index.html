<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진소령 · Portfolio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1F2A;
    --ink-soft: #143447;
    --paper: #F3F0E8;
    --paper-2: #E8E4D8;
    --mint: #2BB8A0;
    --mint-deep: #1A8F7A;
    --coral: #E85D4C;
    --sand: #D4A574;
    --text: #0F2430;
    --muted: #5A6F7A;
    --line: rgba(15, 36, 48, 0.12);
    --glow: rgba(43, 184, 160, 0.22);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Sans KR", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(43,184,160,0.18), transparent 55%),
      radial-gradient(700px 420px at 92% 8%, rgba(232,93,76,0.12), transparent 50%),
      radial-gradient(600px 400px at 70% 100%, rgba(212,165,116,0.14), transparent 45%),
      linear-gradient(165deg, #EDE9DF 0%, var(--paper) 45%, #E4EFEA 100%);
    -webkit-font-smoothing: antialiased;
  }

  .grain {
    pointer-events: none;
    position: fixed;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 22px 56px;
  }

  /* ===== Header ===== */
  header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: end;
    margin-bottom: 28px;
    animation: rise 0.7s ease both;
  }
  .brand-kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mint-deep);
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-family: Syne, sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.08;
    letter-spacing: -0.03em;
  }
  h1 span { color: var(--coral); }
  .lead {
    margin: 10px 0 0;
    max-width: 34em;
    font-size: 15px;
    line-height: 1.65;
    color: var(--muted);
  }
  .header-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .header-meta strong {
    display: block;
    font-family: Syne, sans-serif;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 2px;
  }

  /* ===== KPI strip ===== */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
    animation: rise 0.7s ease 0.08s both;
  }
  .kpi {
    padding: 16px 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .kpi .label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .kpi .value {
    margin-top: 6px;
    font-family: Syne, sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .kpi .sub {
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
  }

  /* ===== Toolbar ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    animation: rise 0.7s ease 0.14s both;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-right: 4px;
  }
  .chip {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.6);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .chip:hover { border-color: var(--mint); color: var(--ink); transform: translateY(-1px); }
  .chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  /* ===== Layout ===== */
  .layout {
    display: grid;
    grid-template-columns: 1.35fr 0.95fr;
    gap: 18px;
    align-items: start;
    animation: rise 0.7s ease 0.2s both;
  }

  .project-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .project {
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.62);
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .project::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent, var(--mint));
    opacity: 0.85;
  }
  .project:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(11, 31, 42, 0.08);
    border-color: rgba(43,184,160,0.35);
  }
  .project.active {
    background: #fff;
    border-color: var(--ink);
    box-shadow: 0 16px 40px rgba(11, 31, 42, 0.1);
  }
  .project.hidden { display: none; }

  .project-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .project-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent, var(--mint-deep));
  }
  .project-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(43,184,160,0.12);
    color: var(--mint-deep);
    font-weight: 600;
    white-space: nowrap;
  }
  .project-status.repo {
    background: rgba(232,93,76,0.12);
    color: var(--coral);
  }
  .project h2 {
    margin: 8px 0 6px;
    font-family: Syne, sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .project p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* ===== Detail panel ===== */
  .detail {
    position: sticky;
    top: 18px;
    border-radius: 18px;
    background: var(--ink);
    color: #E8F2F4;
    padding: 26px 24px 24px;
    min-height: 360px;
    box-shadow: 0 24px 50px rgba(11, 31, 42, 0.28);
    overflow: hidden;
  }
  .detail::after {
    content: "";
    position: absolute;
    right: -40px;
    top: -40px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: var(--glow);
    filter: blur(8px);
  }
  .detail-inner { position: relative; z-index: 1; }
  .detail-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 10px;
  }
  .detail h3 {
    margin: 0 0 12px;
    font-family: Syne, sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .detail .desc {
    margin: 0 0 18px;
    font-size: 14px;
    line-height: 1.7;
    color: rgba(232,242,244,0.78);
  }
  .detail-meta {
    display: grid;
    gap: 10px;
    margin-bottom: 22px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
  }
  .meta-row span:first-child { color: rgba(232,242,244,0.55); }
  .meta-row span:last-child { font-weight: 500; text-align: right; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .btn-primary {
    background: var(--mint);
    color: var(--ink);
  }
  .btn-ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.28);
  }
  .btn[aria-disabled="true"] {
    opacity: 0.45;
    pointer-events: none;
  }

  .highlights {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .highlights h4 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(232,242,244,0.5);
  }
  .highlights ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.7;
    color: rgba(232,242,244,0.82);
  }

  footer {
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    animation: rise 0.7s ease 0.28s both;
  }
  footer a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
  }
  footer a:hover { color: var(--mint-deep); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 860px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .layout { grid-template-columns: 1fr; }
    .detail { position: static; }
    header { grid-template-columns: 1fr; }
    .header-meta { text-align: left; }
  }
  @media (max-width: 480px) {
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .app { padding: 20px 14px 40px; }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header>
    <div>
      <div class="brand-kicker">Educator · AI Creator</div>
      <h1>진소령 <span>Portfolio</span> Dashboard</h1>
      <p class="lead">
        AI 교육·데이터 분석·웹 창작까지, 지금까지 만든 프로젝리를 한곳에서 살펴보는 포트폴리오 대시보드입니다.
      </p>
    </div>
    <div class="header-meta">
      <strong>5 Projects</strong>
      blanciel1977-lab<br>
      Updated Aug 2026
    </div>
  </header>

  <section class="kpi-row" aria-label="요약 지표">
    <div class="kpi">
      <div class="label">전체 프로젝트</div>
      <div class="value" id="kpiTotal">5</div>
      <div class="sub">포트폴리오 수록</div>
    </div>
    <div class="kpi">
      <div class="label">라이브 데모</div>
      <div class="value" id="kpiLive">4</div>
      <div class="sub">GitHub Pages</div>
    </div>
    <div class="kpi">
      <div class="label">교육·AI</div>
      <div class="value">2</div>
      <div class="sub">이야기책 · 퍼스널컬러</div>
    </div>
    <div class="kpi">
      <div class="label">데이터 분석</div>
      <div class="value">2</div>
      <div class="sub">교통 · 따릉이</div>
    </div>
  </section>

  <div class="toolbar" role="toolbar" aria-label="카테고리 필터">
    <span class="filter-label">필터</span>
    <button type="button" class="chip active" data-filter="all">전체</button>
    <button type="button" class="chip" data-filter="education">교육·AI</button>
    <button type="button" class="chip" data-filter="data">데이터 분석</button>
    <button type="button" class="chip" data-filter="web">웹 서비스</button>
    <button type="button" class="chip" data-filter="profile">프로필</button>
  </div>

  <div class="layout">
    <div class="project-list" id="projectList" role="list"></div>

    <aside class="detail" aria-live="polite">
      <div class="detail-inner" id="detailPanel"></div>
    </aside>
  </div>

  <footer>
    <span>단일 HTML · Portfolio Control Panel</span>
    <span>
      <a href="https://github.com/blanciel1977-lab" target="_blank" rel="noopener">GitHub</a>
      ·
      <a href="https://blanciel1977-lab.github.io/portfolio/" target="_blank" rel="noopener">본문 포트폴리오</a>
    </span>
  </footer>
</div>

<script>
const PROJECTS = [
  {

      "주인공→배경→문제→결말 4단계 동화 제작"
    ],
    demo: "https://blanciel1977-lab.github.io/prompt100/",
    repo: "https://github.com/blanciel1977-lab/prompt100"
  },
  {
    id: "traffic",
    title: "교통사고 현황 분석",
    short: "법규위반 사고다발지 지도 · 인사이트 도출",
    category: "data",
    categoryLabel: "데이터 분석",
    accent: "#E85D4C",
    status: "live",
    statusLabel: "Live Demo",
    stack: "HTML · 지도 시각화",
    audience: "교통안전 · 분석 발표",
    summary: "한반도 위·경도 기반 법규위반 사고다발지 데이터를 히트맵·클러스터·블랙맵으로 시각화하고, 중앙선침범·사망사고 중심으로 위험 구간에 대한 인사이트를 도출합니다.",
    highlights: [
      "6,670개 다발지점 밀도 시각화",
      "히트맵 / 블랙맵 / 클러스터 맵",
      "중앙선침범 + 사망사고 핵심 지도",
      "치명도 높은 유형 중심 인사이트"
    ],

  },
  {

    accent: "#1A8F7A",

    highlights: [

    ],

  },
  {
    id: "personal_color",
    title: "나의 퍼스널컬러는?",
    short: "17문항으로 찾는 12시즌 퍼스널컬러 진단",
    category: "web",
    categoryLabel: "웹 서비스",
    accent: "#D4A574",
    status: "live",
    statusLabel: "Live Demo",
    stack: "HTML · 퀴즈 UX",
    audience: "일반 사용자",
    summary: "언더톤·명도·대비·채도 축을 바탕으로 17가지 질문에 답하면, 12가지 시즌 타입 중 나에게 맞는 퍼스널컬러를 찾아주는 자가 진단 웹앱입니다.",
    highlights: [

  },
  {
    id: "portfolio",
    title: "나의 포트폴리오",
    short: "Developer → Educator → AI Creator 여정",
    category: "profile",
    categoryLabel: "프로필",
    accent: "#0B1F2A",
    status: "live",
    statusLabel: "Live Demo",
    stack: "HTML · 스토리텔링",
    audience: "채용 · 협업 · 강의",
    summary: "진소령의 본문 포트폴리오입니다. Developer에서 Educator, AI Creator로 이어지는 여정과 Education Lab, 학교 교육 이력, AI 창작 갤러리를 소개합니다.",
    highlights: [
      "세 가지 정체성 스토리 (Developer / Educator / AI Creator)",
      "Coding · AI · Maker · Creator Lab",
      "2024–2026 학교 교육 포트폴리오",

];

let activeId = PROJECTS[0].id;
let filter = "all";

const listEl = document.getElementById("projectList");
const detailEl = document.getElementById("detailPanel");

function renderList() {
  const visible = PROJECTS.filter(p => filter === "all" || p.category === filter);
  listEl.innerHTML = visible.map(p => `
    <button type="button" class="project ${p.id === activeId ? "active" : ""}" data-id="${p.id}" role="listitem" style="--accent:${p.accent}">
      <div class="project-top">
        <span class="project-tag">${p.categoryLabel}</span>
        <span class="project-status ${p.status === "repo" ? "repo" : ""}">${p.statusLabel}</span>
      </div>
      <h2>${p.title}</h2>
      <p>${p.short}</p>
    </button>
  `).join("");

  if (!visible.some(p => p.id === activeId) && visible[0]) {
    activeId = visible[0].id;
  }
  renderDetail();
}

function renderDetail() {
  const p = PROJECTS.find(x => x.id === activeId) || PROJECTS[0];
  detailEl.innerHTML = `
    <div class="detail-kicker">${p.categoryLabel}</div>
    <h3>${p.title}</h3>
    <p class="desc">${p.summary}</p>
    <div class="detail-meta">
      <div class="meta-row"><span>기술 스택</span><span>${p.stack}</span></div>
      <div class="meta-row"><span>대상</span><span>${p.audience}</span></div>
      <div class="meta-row"><span>상태</span><span>${p.statusLabel}</span></div>
    </div>
    <div class="actions">
      ${p.demo
        ? `<a class="btn btn-primary" href="${p.demo}" target="_blank" rel="noopener">데모 열기 →</a>`
        : `<span class="btn btn-primary" aria-disabled="true">데모 준비 중</span>`}
      <a class="btn btn-ghost" href="${p.repo}" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="highlights">
      <h4>Highlights</h4>
      <ul>${p.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
    </div>
  `;

  listEl.querySelectorAll(".project").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.id === activeId);
  });
}

listEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".project");
  if (!btn) return;
  activeId = btn.dataset.id;
  renderDetail();
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    filter = chip.dataset.filter;
    renderList();
  });
});

document.getElementById("kpiLive").textContent =
  PROJECTS.filter(p => p.demo).length;
document.getElementById("kpiTotal").textContent = PROJECTS.length;

renderList();
</script>
</body>
</html>
